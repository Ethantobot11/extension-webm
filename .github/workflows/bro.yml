name: Build All Platform NDLLs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  HAXE_VERSION: 4.3.7

jobs:
  build:
    name: Build for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            target: "windows -release -nocolor -nocffi"
          - platform: windows64
            os: windows-latest
            target: "windows -64 -release -nocolor -nocffi"
          - platform: linux
            os: ubuntu-latest
            target: "linux -release -nocolor -nocffi"
          - platform: linux64
            os: ubuntu-latest
            target: "linux -64 -release -nocolor -nocffi"
          - platform: mac
            os: macos-15
            target: mac
          - platform: android
            os: ubuntu-latest
            target: android
          - platform: ios
            os: macos-15
            target: "ios -release -nocolor -nocffi"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Select Xcode Path
        if: matrix.platform == 'mac' || matrix.platform == 'ios'
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          sudo xcodebuild -runFirstLaunch

      - name: Setup Android NDK
        if: matrix.platform == 'android'
        id: setup-ndk
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r23c
          add-to-path: false

      - name: Install Linux Build Dependencies
        if: matrix.platform == 'linux' || matrix.platform == 'linux64'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            gcc-multilib g++-multilib \
            libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxi-dev \
            libxrandr-dev libxinerama-dev

      - name: Install Haxe Dependencies
        run: |
          haxelib setup ~/haxelib
          haxelib git hxcpp https://github.com/ShadowEngineTeam/hxcpp --quiet
          haxelib git format https://github.com/HaxeFoundation/format --quiet
          haxelib git hxp https://github.com/openfl/hxp --quiet
          haxelib git lime https://github.com/ArkoseLabsOfficial/lime --quiet
          haxelib install openfl --quiet
          haxelib run lime setup -alias -y --quiet

      - name: Enable HXCPP compile cache
        run: echo "HXCPP_COMPILE_CACHE=~/.hxcpp" >> $GITHUB_ENV

      - name: Configure Android
        if: matrix.platform == 'android'
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT ${{ steps.setup-ndk.outputs.ndk-path }}
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true

      - name: Rebuild Lime & NDLL (Standard Targets)
        if: matrix.platform != 'mac' && matrix.platform != 'android'
        shell: bash
        run: |
          rm -rf ndll/
          haxelib run lime rebuild lime ${{ matrix.target }}
          haxelib run lime rebuild . ${{ matrix.target }} -clean

      - name: Rebuild Lime & NDLL (Android Multi-Architecture)
        if: matrix.platform == 'android'
        shell: bash
        run: |
          rm -rf ndll/
          haxelib run lime rebuild lime android -release -nocolor -nocffi -ONLY_ARMV7
          haxelib run lime rebuild lime android -release -nocolor -nocffi -ONLY_ARM64
          haxelib run lime rebuild lime android -release -nocolor -nocffi -ONLY_X86
          haxelib run lime rebuild lime android -release -nocolor -nocffi -ONLY_X86_64

          haxelib run lime rebuild . android -release -nocolor -nocffi -ONLY_ARMV7
          haxelib run lime rebuild . android -release -nocolor -nocffi -ONLY_ARM64 -clean
          haxelib run lime rebuild . android -release -nocolor -nocffi -ONLY_X86 -clean
          haxelib run lime rebuild . android -release -nocolor -nocffi -ONLY_X86_64 -clean
          
          ls -R ndll/

      - name: Rebuild Lime & NDLL (Mac Multi-Architecture)
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          rm -rf ndll/
          haxelib run lime rebuild lime mac -64 -release -nocolor -nocffi -D HXCPP_M64
          haxelib run lime rebuild lime mac -arm64 -release -nocolor -nocffi -D HXCPP_ARM64
          
          haxelib run lime rebuild . mac -64 -release -nocolor -nocffi -D HXCPP_M64 -clean
          haxelib run lime rebuild . mac -arm64 -release -nocolor -nocffi -D HXCPP_ARM64 -clean
          
          ls -R ndll/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ndll-${{ matrix.platform }}
          path: ndll/
          if-no-files-found: error

  commit-ndlls:
    name: Commit NDLLs to Repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-ndlls

      - name: Organize Artifacts into Root NDLL Folder
        run: |
          mkdir -p ndll
          cp -r downloaded-ndlls/ndll-*/* ndll/
          rm -rf downloaded-ndlls
          ls -R ndll/

      - name: Auto-Commit and Push Binaries
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -f ndll/
          git status
          
          if git diff --staged --quiet; then
            echo "No changes in NDLL binaries to commit."
          else
            git commit -m "chore: auto-update compiled platform ndll binaries [skip ci]"
            git push
          fi
